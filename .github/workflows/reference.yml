name: Finite reference artifact
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral regressions
        run: python -m unittest discover -s tests -v
      - name: Archived structure and historical evidence integrity
        run: python tools/check_baseline.py
      - name: Fresh local-environment probe
        run: python -m durability_debt probe --output runs/ci
      - name: Reusable local checkpoint
        run: python -m durability_debt verify runs/ci
