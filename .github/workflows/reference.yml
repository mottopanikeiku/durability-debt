name: Finite reference artifact
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral regressions
        run: python -m unittest discover -s tests -v
      - name: Handoff and historical evidence integrity
        run: python tools/check_baseline.py
      - name: Fresh local-environment probe
        run: python -m durability_debt probe --output runs/ci
      - name: Reusable local checkpoint
        run: python -m durability_debt verify runs/ci
